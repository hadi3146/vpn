version: '3.8'

services:
  softether-sstp:
    image: siomiz/softether
    container_name: softether-sstp-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - SPW=testpassword123
      - HPW=testpassword123
      - USERS=vpn:vpn
    ports:
      - "443:443/tcp"
      - "992:992/tcp"
      - "1194:1194/udp"
      - "5555:5555/tcp"

